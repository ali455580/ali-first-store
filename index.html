<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر علي الأول</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <i class="fa-solid font-store logo-icon"></i>
                <h1>متجر علي الأول</h1>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="ابحث عن منتج...">
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- شريط الأقسام -->
    <nav class="categories-bar">
        <div class="container" id="categories-filter">
            <button class="cat-btn active" data-category="all">الكل</button>
            <button class="cat-btn" data-category="الكترونيات">إلكترونيات</button>
            <button class="cat-btn" data-category="شاشات">شاشات</button>
            <button class="cat-btn" data-category="ساعات">ساعات</button>
            <button class="cat-btn" data-category="ثلاجات">ثلاجات</button>
            <button class="cat-btn" data-category="مكيفات">مكيفات</button>
        </div>
    </nav>

    <!-- عرض المنتجات -->
    <main class="container main-content">
        <div class="products-grid" id="products-container">
            <!-- يتم تحميل المنتجات هنا تلقائياً -->
        </div>
    </main>

    <!-- لوحة إضافة منتج جديد (للأدمن) -->
    <section class="container admin-section">
        <h3>إضافة منتج جديد</h3>
        <form id="add-product-form">
            <div class="form-group">
                <input type="text" id="product-name" placeholder="اسم المنتج" required>
                <input type="text" id="product-price" placeholder="السعر (د.ع)" required>
            </div>
            <div class="form-group">
                <select id="product-category">
                    <option value="الكترونيات">إلكترونيات</option>
                    <option value="شاشات">شاشات</option>
                    <option value="ساعات">ساعات</option>
                </select>
                <!-- حقل اختيار الصورة مع فاحص الحجم -->
                <input type="file" id="product-image" accept="image/*" required>
            </div>
            <!-- مكان عرض أبعاد وحجم الصورة -->
            <div id="image-info" style="margin-bottom: 12px; font-size: 0.85rem; display: none;"></div>
            <button type="submit" class="btn-gold"><i class="fa-solid fa-plus"></i> إضافة المنتج</button>
        </form>
    </section>

    <!-- النافذة المنبثقة لتفاصيل المنتج (Modal) -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <!-- زر الإغلاق X الواضح والمحسن -->
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
